[project]
name = "lutuflow"
dynamic = ["version"]
description = "A toolbox to segment and track lung tumor nodules in longitudinal series of mice CT scans."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Mallory Wittwer", email = "mallory.wittwer@epfl.ch" }]

classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "ezomero",
    "numpy",
    "pandas",
    "tifffile",
    "pooch",
    "questionary",
    "platformdirs",
    "PyYAML",                    # for nnunet
    "appdirs",                   # for nnunet
    "blosc2",                    # for nnunet
    "nnunetv2",
    "scikit-image",
    "ultralytics",
    "laptrack>=0.17.1",
    "vedo",
    "imaging-server-kit>=0.2",
]

[project.optional-dependencies]
napari = ["imaging-server-kit[napari]>=0.2"]

[project.scripts]
lutuflow = "lutuflow.cli:main"

[project.entry-points."napari.manifest"]
lutuflow = "lutuflow:napari.yaml"

[project.urls]
homepage = "https://github.com/EPFL-Center-for-Imaging/lutuflow"
repository = "https://github.com/EPFL-Center-for-Imaging/lutuflow"

[build-system]
requires = ["setuptools>=42.0.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.setuptools_scm]
write_to = "src/lutuflow/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
